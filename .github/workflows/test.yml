name: Test
on:
  push:
    branches:
      - 'task/**'
jobs:
  userService:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - checkout
        uses: actions/checkout@v4
      - name: Step 2 - set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: maven
      - name: Step 3 - mvn Package
        working-directory: ./userService/
        run: mvn -B clean package -DskipTests
      - name: Step 4 - mvn Tests
        working-directory: ./userService/
        run: mvn -B test --file pom.xml
  orderService:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - checkout
        uses: actions/checkout@v4
      - name: Step 2 - set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'
          cache: maven
      - name: Step 3 - mvn Package
        working-directory: ./orderService/
        run: mvn -B clean package -DskipTests
      - name: Step 4 - mvn Tests
        working-directory: ./orderService/
        run: mvn -B test --file pom.xml