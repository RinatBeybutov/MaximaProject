spring:
  application:
    name: metricsService
  datasource:
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
    url: jdbc:postgresql://localhost:5432/shop
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
server:
  port: 8084
springdoc:
  swagger-ui.url: /openapi.yaml